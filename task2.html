<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-rows: 100px 100px 100px 100px;
            grid-template-columns: 100px 100px 100px 100px 100px 100px;
            gap: 20px;
        }
        .item{
            border: 2px solid green;
            background-color: bisque;
        }
        .a{
            grid-column-start: 1;
            grid-column-end: 6;
          
        }
        .b{
           grid-row:2/4;
           
           
        }
        .c{
            grid-row: 2/2;
            grid-column: 2/6;
          
        }
        .d{
            grid-row: 3/3;
            grid-column: 2/4;
          
            
        }
        .e{
            grid-row: 3/3;
            grid-column: 4/6;
            
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class ="item a">Header</div>
        <div class ="item b">side bar</div>
        <div class ="item c">content1</div>
        <div class ="item d">content2</div>
        <div class ="item e">content3</div>
        <div class ="item a">footer</div>
    </div>
</body>
</html>
